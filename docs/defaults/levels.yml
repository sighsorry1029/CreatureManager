# Config relationship: [2 - Levels] in sighsorry.CreatureManager.cfg (defaults: Full + Easy).
# Configure modifiers and modifierDistanceScaling only in modifier.yml. Legacy entries here are ignored.
# Enable Level System:
#   Off = no CM automatic level assignment, level stat/distance/scale rules, or modifiers.
#   ExceptLevel = keep game/other-mod levels; ignore ALL YAML level weights, biome presets, and Karma/Enforcer level bonuses.
#                 Stat, distance, scale, and modifier rules still apply using the actual level.
#   Full = also enable CM level assignment from matching weights and Karma/Enforcer level bonuses.
# Biome Level Preset (Full only): Easy / Normal / Hard / VeryHard supply built-in biome level weights.
#   None removes ONLY built-in weights; YAML level rules, stat/scale/modifier rules, and level bonuses remain active.
# Global.level is commented out by default. In Full it is the last fallback for non-boss creatures and Enforcers.
#   Easy/Normal/Hard/VeryHard supply biome weights before Global.level, which only fills unmatched cases (such as unsupported biomes).
#   Full + None supplies no built-in weights. Uncomment Global.level to supply fallback weights; more specific YAML level rules still win.
#   With no matching weights AND no Karma/Enforcer bonus, the assigned level is kept. Weights are base rolls, not final level caps.
# Bosses Follow Biome Level Preset (On, Full only): bosses fall back to biome YAML level weights, then the built-in preset.
#   Biome YAML works even with preset None. Off skips both biome fallbacks; explicit Boss/group/prefab rules still work.
#   Only level weights are shared: boss stats/modifiers never inherit top-level biome YAML or Global. Existing biome YAML can now affect new bosses.
# Karma tracking, Enforcer summons, and loot have separate settings. Setting changes do not reroll completed creatures.
#
# Targets: Global, Boss, biome, group, or prefab; omitted fields inherit independently.
# Priority: non-boss/Enforcer prefab > group > biome > Global; regular boss prefab > group > Boss > biome level fallback (if enabled).
# Nested biome blocks override their parent target in that biome.
# Place tamed and bloodMagicSummon directly under Global, a group, or a prefab. Omit both for ordinary stat rules.
# Each block accepts health, damage, speed and their PerLevel fields. Both use the creature's assigned level and apply across biomes.
# speed/speedPerLevel: movement, acceleration, and turning only; multiply with Swift, not attack speed or distanceScaling.
# Speed is saved per creature; completed creatures keep their saved value (1 if absent) until a supported level change.
#
Global:
#   level: [80, 20]                       # Optional fallback weights: zero-star, one-star, ...
#   scalePerLevel: 0.1                    # Optional CM star growth; 0 = none. Omit for prefab sizes in Full/ExceptLevel; CM growth is skipped in dungeons.
  damage: 1                            # Level-1 damage multiplier.
  damagePerLevel: 0.25                 # Vanilla: 0.5. Replaces vanilla growth: damage * (1 + (level - 1) * value).
  health: 1                            # Level-1 max-health multiplier.
  healthPerLevel: 1                    # Health = base * health * (1 + (level - 1) * value).
#   speed: 1                             # Optional movement multiplier; must be > 0. Values below 1 slow movement.
#   speedPerLevel: 0                     # Optional star growth >= 0: speed * (1 + (level - 1) * value). No matching rule = 1 / 0.
#   distanceScaling: [0.03, 0.08, 1000, 5] # damageStep, healthStep, stepMeters, maxSteps (0 = unlimited).

#   tamed:                 # All tamed creatures except Blood Magic summons.
#     health: 1.5
#
#   bloodMagicSummon:      # All Blood Magic summons, including those marked as tamed.
#     health: 1.5

Boss:                                  # Regular bosses only; Enforcers use non-boss rules.
  # level: [100]                       # Boss fallback: level 1; omit to allow enabled biome YAML/preset weights ([] is invalid).
  scalePerLevel: 0.1
  damage: 1
  damagePerLevel: 0.1
  health: 1
  healthPerLevel: 0.5
#   speed: 1
#   speedPerLevel: 0

# Optional examples; uncomment only what you need.
# groups:
#   ForestBrutes:
#     - Troll
#     - Greydwarf_Elite
#
# Meadows:
#   level: [100]
#
# ForestBrutes:
#   health: 1.1
#
# Troll:
#   BlackForest:
#     damage: 1.2
#
# For a single prefab, set only the companion fields you want to override. Other fields inherit.
# Wolf:
#   tamed:
#     health: 1.5
#
# Skeleton_Friendly:
#   bloodMagicSummon:
#     damage: 1.2
#
# Built-in distributions for Biome Level Preset (reference only; level weights apply in Full mode).
# Copy or uncomment only the biome blocks you want to override. Edit existing biome blocks instead of adding duplicate keys.
# Other biomes keep the selected preset's defaults; explicit YAML rules retain their normal priority.
# Weights are ordered from level 1 (zero stars), level 2 (one star), and so on, before Karma/Enforcer bonuses; they are not final star caps.
# None preset: no built-in distribution. Explicit YAML level rules (including Global.level) and Karma/Enforcer bonuses still apply in Full.
# Copied biome level weights also affect regular bosses when Bosses Follow Biome Level Preset is On; Boss/group/prefab level rules take priority.
